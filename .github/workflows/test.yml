name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # The whole suite forks Base. Caching the RPC responses keeps repeat runs off the network:
      # without it every job re-fetches the same state at the pinned block, which is slow and
      # invites rate limiting when falling back to the public endpoint.
      - name: Cache RPC responses
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-base-50875000-${{ hashFiles('test/ForkBase.sol') }}
          restore-keys: rpc-base-50875000-

      - name: Run Forge tests
        env:
          # Optional. Unset (or empty, which is what a missing secret expands to) falls back to
          # the public Base endpoint — see ForkBase._baseRpcUrl.
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test -vvv
