[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Follows Midnight: it is compiled at 0.8.34 / osaka and deployed on Base, so the callback
# must compile against the same interfaces at the same version.
solc = "0.8.34"
evm_version = "osaka"
optimizer = true
optimizer_runs = 466
bytecode_hash = "none"

# Uniswap is bound through interfaces against already-deployed Base contracts rather than
# compiled from source, which keeps this to a single compiler profile despite v3 being
# pinned at 0.7.6 and v4's PoolManager/PositionManager at exactly 0.8.26.

# Inherits profile.default. Declared because the CI workflow sets FOUNDRY_PROFILE=ci, which
# otherwise warns and silently falls back.
[profile.ci]
fuzz = { runs = 1000 }
verbosity = 3

[fmt]
line_length = 120
wrap_comments = true

# `HashLib` is the first Midnight source this project compiles rather than merely binds through an
# interface, and it does not fit in the stack without the IR pipeline — Midnight's own foundry.toml
# sets `via_ir = true`. Restricting the setting to that one path keeps the single-profile promise
# for everything that does not import it — which is weaker than it sounds: anything reaching
# `HashLib`, `script/Demo.s.sol` included, resolves to this profile and deploys the IR build.
# See JOURNAL.md (2026-09-11 deploy) and FEEDBACK.md.
[[profile.default.additional_compiler_profiles]]
name = "midnight-ir"
via_ir = true
optimizer = true
optimizer_runs = 466

[[profile.default.compilation_restrictions]]
paths = "lib/midnight/src/ratifiers/**"
via_ir = true
