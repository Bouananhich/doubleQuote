name: CI

permissions: {}

# `push` is restricted to `main`. Unrestricted, a branch with an open PR runs this job twice
# concurrently — once for the push, once for the pull_request — and the two race each other for
# the public Base endpoint's rate limit. The whole suite forks Base, so a duplicate run doubles
# the RPC volume for no extra coverage, and D6's tick walk raised the number of distinct storage
# slots each test touches enough to make that reliably fatal (HTTP 429, "over rate limit").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # The whole suite forks Base. Caching the RPC responses keeps repeat runs off the network:
      # without it every job re-fetches the same state at the pinned block, which is slow and
      # invites rate limiting when falling back to the public endpoint.
      #
      # The key deliberately varies per run. actions/cache only writes a new entry when the key
      # *missed*, so a key derived from source files would go stale the moment a test touched
      # state the cache did not already hold: the exact key still hits, nothing new is saved, and
      # every subsequent run re-fetches the same additions. Adding the v3 adapter, which mints,
      # burns and swaps on the fork, is exactly that case. A run-unique key with a shared prefix
      # restores the newest cache and always saves the superset back.
      - name: Cache RPC responses
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-base-50875000-${{ github.run_id }}
          restore-keys: rpc-base-50875000-

      # `--compute-units-per-second` and `--fork-retry-backoff` are for the *fallback* endpoint.
      # With no `BASE_RPC_URL` secret the suite runs against the public `mainnet.base.org`, which
      # rate-limits (HTTP 429, "over rate limit") before it finishes. D6 hit that and fixed the
      # half that was self-inflicted — two concurrent jobs racing on one commit. D7 hit it again
      # with a single job: a suite that walks the tick book touches enough distinct cold storage
      # slots to go over on its own. Foundry's default is 330 CUPS, tuned for a paid provider
      # plan, so it is throttled here and given a real backoff to retry into.
      #
      # They are CLI flags, not `foundry.toml` keys — setting them under `[profile.ci]` warns
      # "Found unknown config" and is silently ignored (forge 1.5.1).
      #
      # Mitigation, not a fix. The fix is a private endpoint in the `BASE_RPC_URL` repo secret;
      # see the Build section of CLAUDE.md.
      - name: Run Forge tests
        env:
          # Optional. Unset (or empty, which is what a missing secret expands to) falls back to
          # the public Base endpoint — see ForkBase._baseRpcUrl.
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: forge test -vvv --compute-units-per-second 60 --fork-retry-backoff 10
